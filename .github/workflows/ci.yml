  #
  #  STM32MP257F-DK（実機ターゲット）：build only（リンクまで）
  #  aarch64-none-elf 13.3.rel1 はイメージに同梱（tarball＋actions/cache
  #  だった経緯は docs/dev/ci.md）
  #
  stm32mp257:
    name: Build stm32mp257f_dk (Cortex-A35)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/exshonda/asp3_core-dev:20260606
      #  イメージの既定ユーザはvscode（devcontainer用）のため、Actionsの
      #  ランナーファイルに書けるようrootで実行する
