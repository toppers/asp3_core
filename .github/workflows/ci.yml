#
#		CI（全ターゲットbuild＋POSIX/QEMUテスト実行）
#
#  設計・経緯は docs/dev/ci.md を参照．
#  - PR/push：全ターゲットbuild＋各QEMUスモーク（10分以内目標）
#  - 全件テストは nightly.yml（schedule＋手動dispatch）
#  - 合否判定スクリプトは scripts/ci/（ローカルでも実行可能）
#  - 全ジョブを開発コンテナイメージ（ghcr.io/exshonda/asp3_core-dev）で実行
#    （ツールチェーン・QEMUのピン留め．設計は docs/dev/devcontainer.md）．
#    イメージは日付タグで参照する（暗黙の更新を防ぐ）．更新時は本ファイル内の
#    タグを一括置換すること
#
name: CI

#  CI使用量の削減（2026-06-16）：
#  - push は main のみ（feat/** を外す）。feat ブランチの検証は pull_request 経由。
#    これで「PRのある feat への push で push＋pull_request の二重実行」と
#    「PR前のWIP push での実行」を停止する。
#  - paths-ignore：ドキュメント（**.md・docs/**・LICENSE）のみの変更では CI を
#    スキップ（コード非変更＝ビルド/テスト不要）。コードとdocの混在コミットは実行される。
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  #  POSIXで実行する機能テスト（test/testexec.py TEST_SPECの機能テスト全件．
  #  dlynseのみ除外＝sil_dly_nseの実時間較正でホスト依存．hrt1はHRT単調
  #  クランプ（arch/posix_gcc/posix_timer_itimer.c）で逆行が解消され対象化）
  POSIX_TESTS: >-
    cpuexc1 cpuexc2 cpuexc3 cpuexc4 cpuexc5 cpuexc6 cpuexc7 cpuexc8 cpuexc9 cpuexc10
    dtq1 exttsk flg1 hrt1 int1 mpf1
    mutex1 mutex2 mutex3 mutex4 mutex5 mutex6 mutex7 mutex8
    notify1 pdq1 raster1 raster2 sem1 sem2 suspend1
    sysman1 sysstat1 task1 tmevt1

jobs:
  #
  #  POSIX（linux preset）：build → ctest → 機能テスト全件 → cfgテスト
  #
  posix:
    name: POSIX (linux)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/exshonda/asp3_core-dev:20260606
      #  イメージの既定ユーザはvscode（devcontainer用）のため、Actionsの
      #  ランナーファイルに書けるようrootで実行する
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Build (sample1)
        run: |
          cmake --preset linux -B build/linux
          cmake --build build/linux
      - name: ctest (sample1 run + slog check, JUnit)
        run: ctest --preset linux --output-junit ctest-junit.xml
      - name: Porting verification test (test_porting)
        run: |
          cmake --preset linux -B build/test_porting-linux \
            -DASP3_APPLDIR=test/porting -DASP3_APPLNAME=test_porting \
            -DASP3_EXTRA_APP_C_FILES=test/porting/tap.c
          cmake --build build/test_porting-linux
          ctest --test-dir build/test_porting-linux --output-on-failure
      - name: Function tests (testexec.py)
        run: |
          scripts/ci/run_testexec.py --options "--preset linux" \
            --run "timeout 60 ./asp" --workdir build/testexec-linux \
            ${{ env.POSIX_TESTS }}
      - name: cfg tests (dummy target)
        run: scripts/ci/run_testcfg.sh build/testcfg
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: posix-logs
          path: |
            build/linux/ctest-junit.xml
            build/linux/sample1_actual.jsonl
            build/testexec-linux/testexec.log
            build/testcfg/testcfg.log
          if-no-files-found: ignore

  #
  #  QEMU Cortex-M33（mps2-an505）：build → testexecスモーク
  #
  mps2-qemu:
    name: QEMU mps2-an505 (Cortex-M33)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/exshonda/asp3_core-dev:20260606
      #  イメージの既定ユーザはvscode（devcontainer用）のため、Actionsの
      #  ランナーファイルに書けるようrootで実行する
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Build (sample1)
        run: |
          cmake --preset mps2_an505-qemu -B build/mps2_an505-qemu
          cmake --build build/mps2_an505-qemu
      - name: Smoke tests (testexec.py)
        run: |
          scripts/ci/run_testexec.py --options "--preset mps2_an505-qemu" \
            --run "timeout 60 qemu-system-arm -machine mps2-an505 -nographic \
                   -semihosting-config enable=on,target=native -kernel asp.elf" \
            --workdir build/testexec-mps2 \
            task1 sem1 flg1 int1 tmevt1 hrt1
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mps2-qemu-logs
          path: build/testexec-mps2/testexec.log
          if-no-files-found: ignore

  #
  #  QEMU Cortex-M4（mps2-an386）：build → testexecスモーク
  #  ARMv7-M（非TrustZone・FPv4-SP）＝ __TARGET_ARCH_THUMB=4 経路の検証
  #
  mps2-an386-qemu:
    name: QEMU mps2-an386 (Cortex-M4)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/exshonda/asp3_core-dev:20260606
      #  イメージの既定ユーザはvscode（devcontainer用）のため、Actionsの
      #  ランナーファイルに書けるようrootで実行する
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Build (sample1)
        run: |
          cmake --preset mps2_an386-qemu -B build/mps2_an386-qemu
          cmake --build build/mps2_an386-qemu
      - name: Smoke tests (testexec.py)
        run: |
          scripts/ci/run_testexec.py --options "--preset mps2_an386-qemu" \
            --run "timeout 60 qemu-system-arm -machine mps2-an386 -nographic \
                   -semihosting-config enable=on,target=native -kernel asp.elf" \
            --workdir build/testexec-mps2-an386 \
            task1 sem1 flg1 int1 tmevt1 hrt1
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mps2-an386-qemu-logs
          path: build/testexec-mps2-an386/testexec.log
          if-no-files-found: ignore

  #
  #  QEMU Cortex-M55（mps3-an547）：build → testexecスモーク（mvevpr 含む）
  #  ARMv8.1-M（SSE-300・FPv5-D16・MVE/Helium）＝ __TARGET_ARCH_THUMB=5 経路の検証．
  #  mvevpr は MVE VPR レジスタのコンテキスト退避（core_support.S）を検証する
  #  （an547=PASS／非MVEターゲットでは SKIP）．
  #
  mps3-an547-qemu:
    name: QEMU mps3-an547 (Cortex-M55)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/exshonda/asp3_core-dev:20260606
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Build (sample1)
        run: |
          cmake --preset mps3_an547-qemu -B build/mps3_an547-qemu
          cmake --build build/mps3_an547-qemu
      - name: Smoke tests (testexec.py, incl. MVE VPR preservation)
        run: |
          scripts/ci/run_testexec.py --options "--preset mps3_an547-qemu" \
            --run "timeout 60 qemu-system-arm -machine mps3-an547 -nographic \
                   -semihosting-config enable=on,target=native -kernel asp.elf" \
            --workdir build/testexec-mps3-an547 \
            task1 sem1 flg1 tmevt1 hrt1 mvevpr
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mps3-an547-qemu-logs
          path: build/testexec-mps3-an547/testexec.log
          if-no-files-found: ignore

  #
  #  QEMU Cortex-A9（zybo_z7／xilinx-zynq-a9）：build → sample1スモーク
  #
  zybo-qemu:
    name: QEMU zybo_z7 (Cortex-A9)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/exshonda/asp3_core-dev:20260606
      #  イメージの既定ユーザはvscode（devcontainer用）のため、Actionsの
      #  ランナーファイルに書けるようrootで実行する
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Build (sample1)
        run: |
          cmake --preset zybo_z7-qemu -B build/zybo_z7-qemu
          cmake --build build/zybo_z7-qemu
      - name: Smoke test (sample1)
        run: |
          scripts/ci/smoke_sample1.sh 30 qemu-system-arm -M xilinx-zynq-a9 \
            -semihosting -nographic -serial /dev/null -serial mon:stdio \
            -kernel build/zybo_z7-qemu/asp.elf

  #
  #  QEMU Cortex-A53（zcu102／xlnx-zcu102）：build → sample1＋testexecスモーク
  #  イメージ同梱の aarch64-none-elf（13.3.rel1）を使用＝プリセット素のまま
  #  （A35_TOOLCHAIN_PREFIX 不要．apt aarch64-linux-gnu 時代の経緯は
  #    docs/dev/ci.md．glibc系フォールバックは chip.cmake に残置）
  #
  zcu102-qemu:
    name: QEMU zcu102 (Cortex-A53)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/exshonda/asp3_core-dev:20260606
      #  イメージの既定ユーザはvscode（devcontainer用）のため、Actionsの
      #  ランナーファイルに書けるようrootで実行する
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Build (sample1)
        run: |
          cmake --preset zcu102_arm64-qemu -B build/zcu102_arm64-qemu
          cmake --build build/zcu102_arm64-qemu
      - name: Smoke test (sample1)
        run: |
          scripts/ci/smoke_sample1.sh 30 qemu-system-aarch64 \
            -machine xlnx-zcu102,secure=on -nographic \
            -semihosting-config enable=on,target=native \
            -kernel build/zcu102_arm64-qemu/asp.elf
      - name: Smoke test (testexec.py sem1)
        run: |
          scripts/ci/run_testexec.py \
            --options "--preset zcu102_arm64-qemu" \
            --run "timeout 60 qemu-system-aarch64 -machine xlnx-zcu102,secure=on -nographic \
                   -semihosting-config enable=on,target=native -kernel asp.elf" \
            --workdir build/testexec-zcu102 \
            sem1
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zcu102-qemu-logs
          path: build/testexec-zcu102/testexec.log
          if-no-files-found: ignore

  #
  #  QEMU RV64GC（polarfire／microchip-icicle-kit）：build → sample1スモーク
  #  ※icicle-kitの直接Mモードブート（-bios none -kernel）はQEMU 10.1以降．
  #    イメージのQEMU 10.2で実行（ubuntu:26.04素コンテナ時代の経緯は
  #    docs/dev/ci.md を参照）
  #
  polarfire-qemu:
    name: QEMU polarfire (RV64GC)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/exshonda/asp3_core-dev:20260606
      #  イメージの既定ユーザはvscode（devcontainer用）のため、Actionsの
      #  ランナーファイルに書けるようrootで実行する
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Build (sample1)
        run: |
          cmake --preset polarfire_soc_kit-qemu -B build/polarfire_soc_kit-qemu
          cmake --build build/polarfire_soc_kit-qemu
      - name: Smoke test (sample1)
        run: |
          scripts/ci/smoke_sample1.sh 60 qemu-system-riscv64 \
            -machine microchip-icicle-kit -nographic \
            -semihosting-config enable=on,target=native \
            -bios none -kernel build/polarfire_soc_kit-qemu/asp.elf
      - name: Porting verification test (test_porting)
        run: |
          cmake --preset polarfire_soc_kit-qemu -B build/test_porting-polarfire \
            -DASP3_APPLDIR=test/porting -DASP3_APPLNAME=test_porting \
            -DASP3_EXTRA_APP_C_FILES=test/porting/tap.c
          cmake --build build/test_porting-polarfire
          timeout 60 qemu-system-riscv64 -machine microchip-icicle-kit \
            -nographic -semihosting-config enable=on,target=native \
            -bios none -kernel build/test_porting-polarfire/asp.elf \
            | tee test_porting.log || true
          grep -q "# 6/6 passed" test_porting.log

  #
  #  QEMU RV32IMC（esp32c3）：build → sample1スモーク → test_porting →
  #  testexecスモーク
  #  ※esp32c3マシンは上流QEMUに無いため，Espressif版QEMU（プレビルト）を
  #    ジョブ内でダウンロードして使用する（Direct Bootのフラッシュ
  #    イメージ起動．経緯は docs/dev/esp-idf-integration.md）
  #
  esp32c3-qemu:
    name: QEMU esp32c3 (RV32IMC)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/exshonda/asp3_core-dev:20260606
      #  イメージの既定ユーザはvscode（devcontainer用）のため、Actionsの
      #  ランナーファイルに書けるようrootで実行する
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      QEMU_ESP: /opt/qemu-esp/bin/qemu-system-riscv32
    steps:
      - uses: actions/checkout@v5
      - name: Install Espressif QEMU (esp32c3)
        run: |
          curl -fsSL -o /tmp/qemu-esp.tar.xz \
            https://github.com/espressif/qemu/releases/download/esp-develop-9.2.2-20260417/qemu-riscv32-softmmu-esp_develop_9.2.2_20260417-x86_64-linux-gnu.tar.xz
          echo "547f03e04701a92cbb699f7f7d015adc1f5b5ef93cbb94c0dd9b7107e2d84e77 */tmp/qemu-esp.tar.xz" | sha256sum -c -
          mkdir -p /opt/qemu-esp
          tar -xJf /tmp/qemu-esp.tar.xz -C /opt/qemu-esp --strip-components=1
          $QEMU_ESP --version
      - name: Build (sample1)
        run: |
          cmake --preset esp32c3-qemu -B build/esp32c3-qemu
          cmake --build build/esp32c3-qemu
      - name: Smoke test (sample1)
        run: |
          scripts/ci/smoke_sample1.sh 60 $QEMU_ESP -M esp32c3 -nographic \
            -semihosting \
            -drive file=build/esp32c3-qemu/asp_flash.bin,if=mtd,format=raw
      - name: Porting verification test (test_porting)
        run: |
          cmake --preset esp32c3-qemu -B build/test_porting-esp32c3 \
            -DASP3_APPLDIR=test/porting -DASP3_APPLNAME=test_porting \
            -DASP3_EXTRA_APP_C_FILES=test/porting/tap.c
          cmake --build build/test_porting-esp32c3
          timeout 60 $QEMU_ESP -M esp32c3 -nographic -semihosting \
            -drive file=build/test_porting-esp32c3/asp_flash.bin,if=mtd,format=raw \
            | tee test_porting.log || true
          grep -q "# 6/6 passed" test_porting.log
      - name: Smoke tests (testexec.py)
        run: |
          scripts/ci/run_testexec.py --options "--preset esp32c3-qemu" \
            --run "timeout 60 $QEMU_ESP -M esp32c3 -nographic -semihosting \
                   -drive file=asp_flash.bin,if=mtd,format=raw" \
            --workdir build/testexec-esp32c3 \
            task1 sem1 flg1 int1 tmevt1 hrt1
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: esp32c3-qemu-logs
          path: build/testexec-esp32c3/testexec.log
          if-no-files-found: ignore

  #
  #  Raspberry Pi PICO2（実機ターゲット）：build only
  #
  pico2:
    name: Build pico2_arm (Cortex-M33)
